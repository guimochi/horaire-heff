name: sync

on:
  schedule:
    # Wide UTC window covers both CET and CEST; isInRunWindow filters to Brussels hours.
    # Minute 4/34, not 0/30: top-of-hour schedules are the ones GitHub delays or drops under load.
    - cron: '4,34 4-21 * * 1-6'
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # No install scripts: this job holds the secrets. Nothing it runs needs one (tsx's esbuild binary comes from its
      # platform package, and the browser is installed by the explicit step below).
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx tsx src/sync/main.ts
        env:
          API_BASE: ${{ secrets.API_BASE }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
